services:
  postgres:
    image: postgres:16-alpine
    container_name: carenest_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carenest}
      POSTGRES_USER: ${POSTGRES_USER:-carenest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carenest}
    ports:
      - "5432:5432"
    volumes:
      - carenest_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carenest} -d ${POSTGRES_DB:-carenest}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  carenest_pgdata:

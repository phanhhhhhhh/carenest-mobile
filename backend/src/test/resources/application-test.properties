spring.datasource.url=jdbc:h2:mem:carenest_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.properties.hibernate.type.preferred_json_jdbc_type=VARCHAR
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
carenest.seed.enabled=false
jwt.secret=carenest-test-secret-key-for-testing-only-min-32-chars
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=2592000000
firebase.credentials-path=

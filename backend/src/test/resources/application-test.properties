# Testcontainers provides the datasource URL dynamically
spring.datasource.url=jdbc:tc:postgresql:15:///carenest_test
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
carenest.seed.enabled=false
jwt.secret=carenest-test-secret-key-for-testing-only-min-32-chars
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=2592000000
firebase.credentials-path=

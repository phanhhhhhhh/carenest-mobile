spring.datasource.url=jdbc:postgresql://localhost:5433/carenest
spring.datasource.username=${DATABASE_USERNAME:carenest}
spring.datasource.password=${DATABASE_PASSWORD:carenest}

spring.jpa.show-sql=true

server.port=8082
carenest.seed.enabled=true

# No dev default: a secret committed to the repo must never be able to sign
# live tokens in any profile. JwtService.init() fails fast if it is missing or
# shorter than 32 characters, so set JWT_SECRET locally too.
jwt.secret=${JWT_SECRET}

logging.level.com.carenest=DEBUG
logging.level.org.flywaydb=DEBUG
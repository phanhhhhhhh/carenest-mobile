spring.datasource.url=jdbc:postgresql://localhost:5433/carenest
spring.datasource.username=${DATABASE_USERNAME:carenest}
spring.datasource.password=${DATABASE_PASSWORD:carenest}

spring.jpa.show-sql=true

server.port=8081
carenest.seed.enabled=true

logging.level.com.carenest=DEBUG
logging.level.org.flywaydb=DEBUG
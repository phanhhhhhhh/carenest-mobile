spring.application.name=carenest-backend

# Render free tier: giảm cold start time (~60-90s → ~30s)
spring.main.lazy-initialization=true

# PostgreSQL (Render)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/carenest}
spring.datasource.username=${DATABASE_USERNAME:carenest}
spring.datasource.password=${DATABASE_PASSWORD:carenest}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Java 21 Virtual Threads — xử lý concurrent requests hiệu quả hơn thread pool
spring.threads.virtual.enabled=true

# Actuator — chỉ expose /actuator/health cho Uptime Robot ping
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# OpenAPI / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Logging
logging.level.com.carenest=INFO

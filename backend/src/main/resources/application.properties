spring.application.name=carenest-backend

spring.main.lazy-initialization=true

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/carenest}
spring.datasource.username=${DATABASE_USERNAME:carenest}
spring.datasource.password=${DATABASE_PASSWORD:carenest}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

jwt.secret=${JWT_SECRET:dev-secret-key-for-local-dev-only-min-32-chars}
jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}

logging.level.com.carenest=INFO
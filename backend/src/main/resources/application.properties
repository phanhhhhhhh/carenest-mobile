spring.application.name=carenest-backend

spring.main.lazy-initialization=true

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/carenest}
spring.datasource.username=${DATABASE_USERNAME:carenest}
spring.datasource.password=${DATABASE_PASSWORD:carenest}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ── CORS ─────────────────────────────────────────────────────────────
# Comma-separated list of allowed origin patterns. Never defaults to a
# wildcard so a prod deployment can't silently inherit an open CORS policy.
# For multi-origin local dev, set CORS_ALLOWED_ORIGINS in .env.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8082}

firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}

logging.level.com.carenest=INFO

# ── Gemini AI ────────────────────────────────────────────────────────
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-2.0-flash}
gemini.api.max-tokens=${GEMINI_MAX_TOKENS:1024}
gemini.api.temperature=${GEMINI_TEMPERATURE:0.7}

# ── Imou Camera Platform ─────────────────────────────────────────────
imou.api.enabled=${IMOU_ENABLED:false}
imou.api.base-url=${IMOU_API_BASE_URL:https://openapi.imoulife.com}
imou.api.app-id=${IMOU_APP_ID:}
imou.api.app-secret=${IMOU_APP_SECRET:}
imou.api.connection-timeout=${IMOU_CONNECTION_TIMEOUT:10s}
imou.api.read-timeout=${IMOU_READ_TIMEOUT:30s}
imou.token-refresh.fixed-delay=${IMOU_TOKEN_REFRESH_INTERVAL_MS:86400000}
imou.token-refresh.initial-delay=${IMOU_TOKEN_REFRESH_INITIAL_DELAY_MS:86400000}
imou.token-refresh.retry.max-attempts=${IMOU_TOKEN_REFRESH_RETRY_MAX_ATTEMPTS:3}
imou.token-refresh.retry.delay-ms=${IMOU_TOKEN_REFRESH_RETRY_DELAY_MS:1000}

# ── Payment ───────────────────────────────────────────────────────────
payment.vnpay.tmn-code=${VNPAY_TMN_CODE:}
payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
payment.vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
payment.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/payment/vnpay/return}

payment.momo.partner-code=${MOMO_PARTNER_CODE:}
payment.momo.access-key=${MOMO_ACCESS_KEY:}
payment.momo.secret-key=${MOMO_SECRET_KEY:}
payment.momo.pay-url=${MOMO_PAY_URL:https://test-payment.momo.vn/v2/gateway/api/create}
payment.momo.return-url=${MOMO_RETURN_URL:http://localhost:8080/api/payment/momo/return}

# ── Google Fit ───────────────────────────────────────────────────────
google.fit.client-id=${GOOGLE_FIT_CLIENT_ID:}
google.fit.client-secret=${GOOGLE_FIT_CLIENT_SECRET:}
google.fit.redirect-uri=${GOOGLE_FIT_REDIRECT_URI:http://localhost:8080/api/google-fit/callback}

# ── SMS (SpeedSMS) ───────────────────────────────────────────────────
sms.speedsms.api-url=${SMS_API_URL:https://api.speedsms.vn/index.php/sms/send}
sms.speedsms.access-token=${SMS_ACCESS_TOKEN:}
sms.speedsms.sender=${SMS_SENDER:}
sms.speedsms.type=${SMS_TYPE:2}

# ── Email ────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ── Frontend ─────────────────────────────────────────────────────────
carenest.frontend.url=${FRONTEND_URL:http://localhost:3000}

# SOS Escalation to Secondary Contact (Ticket 2)
carenest.emergency.escalation.enabled=true
carenest.emergency.escalation.level1-timeout-minutes=3
carenest.emergency.escalation.level2-timeout-minutes=10
carenest.emergency.escalation.poll-interval-ms=30000

# Free Broadcast — sequential paging + whole-family escalation (UC A3 / A4)
carenest.broadcast.enabled=true
carenest.broadcast.advance-timeout-minutes=15
carenest.broadcast.escalate-timeout-minutes=120
carenest.broadcast.poll-interval-ms=60000

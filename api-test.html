<!DOCTYPE html>
<html>
<body>
<h2>CareNest API Test</h2>
<button onclick="testRegister()">Test Register</button>
<button onclick="testLogin()">Test Login</button>
<pre id="out"></pre>
<script>
const API = 'http://localhost:8088/api';
function log(msg) { document.getElementById('out').textContent += msg + '\n'; }

async function testRegister() {
  log('Registering...');
  try {
    const res = await fetch(API + '/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        phone: '+84350111222',
        name: 'Browser Test',
        password: 'Test@1234',
        confirmPassword: 'Test@1234',
        role: 'FAMILY'
      })
    });
    const data = await res.json();
    log('Status: ' + res.status);
    log(JSON.stringify(data, null, 2));
  } catch(e) {
    log('ERROR: ' + e.message);
  }
}

async function testLogin() {
  log('Logging in...');
  try {
    const res = await fetch(API + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: '+84768554948', password: 'Test@1234' })
    });
    const data = await res.json();
    log('Status: ' + res.status);
    log('Token: ' + (data.accessToken ? data.accessToken.substring(0, 30) + '...' : 'NONE'));
  } catch(e) {
    log('ERROR: ' + e.message);
  }
}
</script>
</body>
</html>
